<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#0d0d0d; font-family: Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0d0d; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="background-color:#1c1c1c; border:1px solid #2a2a2a; border-radius:16px; padding:40px; max-width:560px;">
          <tr>
            <td>
              <h2 style="color:#ff8800; margin:0 0 20px; font-size:24px;">Zdravo {{username}},</h2>
              <p style="color:#f5f5f5; font-size:15px; line-height:1.6; margin:0 0 20px;">
                Hvala na registraciji! Da aktiviraš nalog, klikni na dugme ispod:
              </p>
              <p style="text-align:center; margin:28px 0;">
                <a href="{{verifyUrl}}"
                   style="display:inline-block; padding:12px 28px; background-color:#ff8800; color:#111;
                          text-decoration:none; border-radius:8px; font-weight:bold; font-size:15px;">
                  Potvrdi nalog
                </a>
              </p>
              <p style="color:#999; font-size:13px; line-height:1.6; margin:0 0 8px;">
                Ako dugme ne radi, otvori ovaj link direktno:<br />
                <a href="{{verifyUrl}}" style="color:#ff8800;">{{verifyUrl}}</a>
              </p>
              <p style="color:#666; font-size:12px; margin:20px 0 0;">Link važi 24h.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
