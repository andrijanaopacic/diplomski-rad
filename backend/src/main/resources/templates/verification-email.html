<div style="font-family: Arial, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h2>Zdravo {{username}},</h2>
  <p>Hvala na registraciji! Da aktiviraš nalog, klikni na dugme ispod:</p>
  <p style="text-align:center; margin: 24px 0;">
    <a href="{{verifyUrl}}" style="padding:12px 18px; background:#2563eb; color:#fff;
       text-decoration:none; border-radius:8px;">Potvrdi nalog</a>
  </p>
  <p>Ako dugme ne radi, otvori ovaj link direktno: {{verifyUrl}}</p>
  <p style="color:#888; font-size:12px;">Link važi 24h.</p>
</div>
