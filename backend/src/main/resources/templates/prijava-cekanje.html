<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#0d0d0d; font-family: Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0d0d; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="background-color:#1c1c1c; border:1px solid #2a2a2a; border-radius:16px; padding:40px; max-width:560px;">
          <tr>
            <td>
              <h2 style="color:#ff8800; margin:0 0 20px; font-size:24px;">Na listi ste čekanja</h2>
              <p style="color:#f5f5f5; font-size:15px; line-height:1.6; margin:0 0 8px;">
                Zdravo {{username}},
              </p>
              <p style="color:#f5f5f5; font-size:15px; line-height:1.6; margin:0 0 16px;">
                Trenutno su sva mesta za aktivnost <strong style="color:#ff8800;">{{aktivnostNaziv}}</strong> popunjena.
              </p>
              <p style="color:#ccc; font-size:14px; line-height:1.6; margin:0;">
                Vaša prijava je zabeležena na listi čekanja - ukoliko se oslobodi mesto,
                dobićete novo obaveštenje sa QR kodom.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
